[package]
name = "local-logs-server"
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Rust loopback companion for the Local Logs web reader"
publish = false

[dependencies]
rlogger = { path = "../lib-rust-logger" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
hyper-util = { version = "0.1.20", features = ["server-auto", "service", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
percent-encoding = "2"
url = "2"
tar = "0.4.46"

[dev-dependencies]
tempfile = "3.27"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", features = ["sink"] }
