[package]
name = "rlogger"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
autoexamples = false
description = "Bounded, ordered local file logging with per-instance context and rotation"
license = "MIT"
readme = "README.md"
repository = "https://github.com/simonbdbc/rlogger"
documentation = "https://docs.rs/rlogger"
keywords = ["logging", "files", "tracing", "rotation", "observability"]
categories = ["development-tools::debugging"]
exclude = ["target", "docs", "logs"]

[features]
default = []
log = ["dep:log"]
tracing = ["dep:tracing", "dep:tracing-subscriber"]

[dependencies]
libc = "0.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
log = { version = "0.4.34", features = ["std"], optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true, default-features = false, features = ["registry", "std"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "time"] }

[[example]]
name = "tracing_workflow"
required-features = ["tracing"]

[[example]]
name = "log_facade"
required-features = ["log"]

[[example]]
name = "native"

[[example]]
name = "workflow"
